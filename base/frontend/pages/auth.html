<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập / Đăng ký</title>
  <link rel="icon" href="../assets/images/logo.svg">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-root="../">
  <header id="app-header"></header>

  <main class="container layout-2col">
    <section class="card">
      <h2>Đăng nhập</h2>
      <p id="login-error" class="text-error"></p>
      <form id="login-form">
        <label for="login-email">Email *</label>
        <input id="login-email" name="email" type="email" required>

        <label for="login-password">Mật khẩu *</label>
        <input id="login-password" name="password" type="password" required>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Đăng nhập</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Đăng ký</h2>
      <p id="register-error" class="text-error"></p>
      <form id="register-form">
        <label for="reg-name">Họ tên *</label>
        <input id="reg-name" name="full_name" type="text" required minlength="2">

        <label for="reg-email">Email *</label>
        <input id="reg-email" name="email" type="email" required>

        <label for="reg-phone">Số điện thoại</label>
        <input id="reg-phone" name="phone" type="text">

        <label for="reg-password">Mật khẩu * (8 - 72 ký tự)</label>
        <input id="reg-password" name="password" type="password" required minlength="8" maxlength="72">

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Đăng ký</button>
        </div>
      </form>
    </section>
  </main>

  <footer id="app-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/auth.js"></script>
</body>
</html>
