<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng | KS25 Base</title>
    <link rel="icon" href="../assets/images/logo.svg">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body data-root="../">
    <header id="app-header"></header>

    <main class="container">
        <section class="card">
            <h1>Giỏ hàng của bạn</h1>
            <div id="cart-empty" class="status status-loading" style="display: none;">
                Giỏ hàng đang trống. <a href="items.html">Quay lại mua sắm</a>
            </div>

            <div id="cart-content">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Sản phẩm</th>
                                <th class="text-right">Đơn giá</th>
                                <th style="text-align: center;">Số lượng</th>
                                <th class="text-right">Thành tiền</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="cart-table-body">
                            <!-- Nội dung giỏ hàng sẽ được render bằng JS -->
                        </tbody>
                    </table>
                </div>

                <div class="cart-total">
                    <h3>Tổng cộng: <span id="cart-grand-total" class="text-primary">0 ₫</span></h3>
                    <button class="btn btn-primary" onclick="alert('Chức năng thanh toán đang phát triển!')">Tiến hành
                        đặt hàng</button>
                </div>
            </div>
        </section>
    </main>

    <footer id="app-footer"></footer>

    <!-- Thứ tự script quan trọng -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/pages/cart.js"></script>
</body>

</html>
