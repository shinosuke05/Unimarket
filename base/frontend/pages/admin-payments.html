
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xác nhận thanh toán - UniMarket</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-root="../">
<header id="app-header"></header>

<main class="container">
    <h1>Xác nhận thanh toán</h1>
    <p class="muted">Kiểm tra các giao dịch chuyển khoản đang chờ xác nhận.</p>

    <section class="card">
        <button class="btn btn-primary" id="reload">Tải lại</button>
        <p id="message" class="status status-loading">Đang tải...</p>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Mã đơn</th>
                    <th>Khách hàng</th>
                    <th>Số tiền</th>
                    <th>Trạng thái thanh toán</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody id="payments"></tbody>
            </table>
        </div>
    </section>
</main>

<footer id="app-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/pages/admin-payments.js"></script>
</body>
</html>
