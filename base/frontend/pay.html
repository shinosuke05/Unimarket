<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/style.css"></head>
<body><main>
<p><a id="back" href="orders.html">‹ Quay lại đơn hàng</a></p>
<div id="box"><p class="empty">Đang tải...</p></div>
</main>
<script src="js/common.js"></script>
<script>
layout("Thanh toán chuyển khoản");
const id = params.get("id");
$("#back").href = "order-detail.html?id=" + id;
let order, shop;
async function load() {
  try {
    [order, shop] = await Promise.all([api("/orders/" + id), api("/store-settings")]);
    render();
  } catch (e) { $("#box").innerHTML = `<p class="empty">${esc(e.message)}</p>`; }
}
const copyable = (v) => `<span class="copy" title="Bấm để sao chép" style="cursor:pointer" data-copy="${esc(v)}">${esc(v)}</span>`;
function render() {
  const st = order.payment ? order.payment.status : "UNPAID";
  const noInfo = !shop.bank_account_number && !shop.qr_image_url;
  $("#box").innerHTML = `
  <h1>Thanh toán đơn ${order.code}</h1>
  <div class="card row"><span>Trạng thái thanh toán</span>${badge(PAY, st)}</div>
  ${noInfo ? `<p class="empty">Cửa hàng chưa cập nhật thông tin chuyển khoản. Vui lòng liên hệ ${esc(shop.phone || "cửa hàng")}.</p>` : `
  <div class="card qr">
    ${shop.qr_image_url ? `<img src="${esc(shop.qr_image_url)}" alt="Mã QR chuyển khoản">` : ""}
    <div>
      <div class="line"><span class="mute">Chủ tài khoản</span><b>${esc(shop.bank_account_holder || "—")}</b></div>
      <div class="line"><span class="mute">Số tài khoản</span>${copyable(shop.bank_account_number || "—")}</div>
      <div class="line"><span class="mute">Ngân hàng</span><b>${esc(shop.bank_name || "—")}</b></div>
      <div class="line"><span class="mute">Số tiền</span>${copyable(Math.round(order.total_amount))} <b>${money(order.total_amount)}</b></div>
      <div class="line"><span class="mute">Nội dung chuyển khoản</span>${copyable(order.code)}</div>
      <p class="mute">Nhập đúng nội dung chuyển khoản để cửa hàng đối chiếu nhanh.</p>
    </div>
  </div>`}
  ${st === "UNPAID" ? `<button id="done">Tôi đã chuyển khoản</button>` : ""}
  ${st === "PENDING_CONFIRMATION" ? `<p class="card">Đã ghi nhận. Cửa hàng sẽ kiểm tra và xác nhận thanh toán của bạn sớm.</p>` : ""}
  ${st === "PAID" ? `<p class="card">Thanh toán thành công. Cảm ơn bạn!</p>` : ""}
  <p class="mute">Cần hỗ trợ: ${esc(shop.phone || "")} ${shop.zalo ? "· Zalo " + esc(shop.zalo) : ""} ${shop.facebook_url ? `· <a href="${esc(shop.facebook_url)}" target="_blank" rel="noopener">Facebook</a>` : ""}</p>`;
  const d = $("#done");
  if (d) d.onclick = async () => {
    d.disabled = true;
    try { order = await post(`/orders/${id}/payment/mark-transferred`); render(); toast("Đã gửi xác nhận chuyển khoản"); }
    catch (e) { toast(e.message); d.disabled = false; }
  };
}
document.addEventListener("click", (e) => {
  const v = e.target.dataset?.copy;
  if (v) navigator.clipboard.writeText(v).then(() => toast("Đã sao chép " + v));
});
load();
</script></body></html>
