
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý đơn hàng - UniMarket</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-root="../">
<header id="app-header"></header>

<main class="container">
    <h1>Quản lý đơn hàng</h1>
    <p class="muted">Theo dõi, xác nhận và cập nhật đơn hàng của khách.</p>

    <section class="card">
        <div class="list-header">
            <input id="keyword" type="search" placeholder="Tìm mã đơn, tên hoặc số điện thoại">
            <select id="status">
                <option value="">Tất cả trạng thái</option>
                <option value="PENDING">Chờ xác nhận</option>
                <option value="CONFIRMED">Đã xác nhận</option>
                <option value="SHIPPING">Đang giao</option>
                <option value="COMPLETED">Hoàn thành</option>
                <option value="CANCELLED">Đã hủy</option>
            </select>
            <button class="btn btn-primary" id="reload">Tải lại</button>
        </div>
        <p id="message" class="status status-loading">Đang tải đơn hàng...</p>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Mã đơn</th>
                    <th>Khách hàng</th>
                    <th>Số điện thoại</th>
                    <th>Tổng tiền</th>
                    <th>Thanh toán</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody id="orders"></tbody>
            </table>
        </div>
    </section>
</main>

<footer id="app-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/pages/admin-orders.js"></script>
</body>
</html>
